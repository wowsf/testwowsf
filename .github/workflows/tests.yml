name: unit tests

on:
  push:
    paths:
      - 'winutil.ps1'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'winutil.ps1'
      - 'tests/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  pester:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run unit tests
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1 -CI

      - name: Coverage report
        if: always()
        shell: pwsh
        run: ./tests/Get-CoverageReport.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: tests/testResults.xml
          if-no-files-found: warn
